# tmux config — managed by chezmoi
# (Zellij is primary multiplexer; tmux as fallback)

# Prefix: Ctrl+a (matches Zellij)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# History
set -g history-limit 10000

# Reduce escape delay
set -sg escape-time 10

# Status bar (Catppuccin-inspired)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S "
set -g status-right "#[bg=#313244,fg=#cdd6f4] %H:%M "
set -g window-status-current-style "bg=#a6e3a1,fg=#1e1e2e,bold"
set -g window-status-style "bg=#313244,fg=#cdd6f4"
