# TLP battery-saver drop-in — installed to /etc/tlp.d/01-battery-saver.conf
# Overrides the stock defaults. Tuned for an Intel Skylake ultrabook
# (i7-6600U, HD 520 iGPU, NVMe). On AC = full speed; on BAT = save power.
# Apply: sudo tlp start   ·   Inspect: tlp-stat -s / tlp-stat -p

# ---- CPU ----
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Intel HWP energy/performance hint: favor power on battery.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Turbo boost: on for AC, off on battery (biggest single battery win).
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Cap max CPU to 70% on battery — smoother heat + longer runtime.
# Comment out if it feels sluggish.
CPU_MAX_PERF_ON_BAT=70

# ---- Platform / ACPI power profile ----
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# ---- PCIe Active State Power Management ----
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# ---- Runtime power management for PCI(e) devices ----
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

# ---- Disk (NVMe here; SATA keys are no-ops but harmless if a SATA disk exists) ----
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"
SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="min_power"

# ---- Intel GPU frequency (Skylake HD 520) ----
# Let the driver manage; uncomment to clamp on battery if needed.
#INTEL_GPU_MIN_FREQ_ON_BAT=300
#INTEL_GPU_MAX_FREQ_ON_BAT=600

# ---- Audio codec power save ----
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1

# ---- Wi-Fi power saving ----
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ---- USB autosuspend ----
USB_AUTOSUSPEND=1

# ---- Battery charge thresholds (BATTERY HEALTH, not runtime) ----
# Stops charging at 80% to slow battery wear. Trade-off: less usable capacity.
# DISABLED by default so the laptop charges to 100%. Uncomment to enable.
# Gotcha: if enabled, the battery will NOT charge past 80% — that's expected.
#START_CHARGE_THRESH_BAT0=75
#STOP_CHARGE_THRESH_BAT0=80
